<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'">
  <link rel="icon" href="atelier-icon.png">
  <link rel="apple-touch-icon" href="atelier-icon.png">
  <meta name="apple-mobile-web-app-title" content="アトリエ">
  <link rel="manifest" href="atelier.webmanifest">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f6e9df">
  <meta name="description" content="おひめさまの、ちいさなおしたくアトリエ。着せ替えて、絵地図で遊園地や水族館へおでかけしよう。">
  <title>おひめさまの アトリエ</title>
  <link rel="stylesheet" href="style.css?v=b3398d7f2f0d">
  <link rel="stylesheet" href="makeup.css?v=85f72e108d3f">
  <link rel="stylesheet" href="face-desk.css?v=43605ff4ff23">
  <link rel="stylesheet" href="hair.css?v=d0f806e65527">
  <link rel="stylesheet" href="outing.css?v=f4a687d05c8c">
  <script src="assets.js?v=b7e1c331d006" defer></script>
  <script src="extras.js?v=e7890195668e" defer></script>
  <script src="hair.js?v=628b40b8f8c5" defer></script>
  <script src="face-studio.js?v=0966b918c7e7" defer></script>
  <script src="body-skin.js?v=93db9363e0c2" defer></script>
  <script src="friend-book.js?v=61e67e425866" defer></script>
  <script src="face-desk.js?v=f40286377f23" defer></script>
  <script src="coord-art.js?v=24cad6426ad1" defer></script>
  <script src="art.js?v=fa03ecc67d29" defer></script>
  <script src="beauty.js?v=efacaee1ef21" defer></script>
  <script src="idle.js?v=db46850abd61" defer></script>
  <script src="outing.js?v=136e38e25cd8" defer></script>
  <script src="music.js?v=01a1d991b2b8" defer></script>
  <script src="app.js?v=3f49dfe74c6f" defer></script>
</head>
<body>
  <main class="app" id="app">
    <header class="topbar">
      <button class="icon-button undo-button" id="undo" aria-label="ひとつ もどす" title="ひとつ もどす"></button>
      <div class="brand"><span class="brand-flower">✧</span><span>おひめさまの<br><b>アトリエ</b></span></div>
      <div class="top-actions">
        <button class="icon-button" id="sound" aria-label="おとを けす" title="おと"></button>
        <button class="icon-button parent-button" id="parents" aria-label="おうちのかた（ながくおす）" title="おうちのかた（ながくおす）"></button>
      </div>
    </header>

    <section class="atelier" aria-label="おひめさまの おしたく">
      <div class="stage-wrap">
        <div class="stage" id="stage" data-background="garden">
          <div class="stage-halo"></div>
          <div class="stage-label" id="stageLabel"><span>じゆうに えらんでね</span><i>✧</i></div>
          <nav class="play-mode-switch" id="playModes" aria-label="あそびを えらぶ"></nav>
          <div class="doll" id="doll" aria-label="おひめさま"></div>
          <div class="sparkle-layer" id="sparkles" aria-hidden="true"></div>
          <span class="friend-name" id="friendName"></span>
          <div class="stage-bottom">
            <div class="stage-guests"><button class="photo-button" id="photo" aria-label="しゃしんで あそぶ"><span class="photo-icon"></span><span>しゃしん</span></button><button class="photo-button hidden" id="friends" aria-label="おともだちの えほん" hidden><span class="friend-book-icon" aria-hidden="true"></span><span>ともだち</span></button></div>
            <button class="done-button" id="done"><span class="done-icon"></span><span>できた！</span></button>
          </div>
        </div>
      </div>

      <aside class="wardrobe" aria-label="えらぶ たな">
        <div class="wardrobe-heading"><span class="tiny-star">✦</span><span id="categoryTitle">どれに する？</span><span class="tiny-star">✦</span></div>
        <nav class="categories" id="categories" aria-label="おきがえの しゅるい"></nav>
        <div class="closet-body" id="closetBody"></div>
        <div class="wardrobe-hint" id="wardrobeHint">すきな えを タッチ</div>
      </aside>
    </section>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <div class="start-screen" id="startScreen">
    <div class="start-petals" aria-hidden="true">✧ <span>✦</span> ✧</div>
    <div class="start-princess" id="startPrincess" aria-hidden="true"></div>
    <div class="start-brand">おひめさまの<br><strong>アトリエ</strong></div>
    <p>きょうは、どんな おしたく？</p>
    <div class="start-play-choices">
      <button class="start-choice princess-choice" id="start" aria-label="あそぶ"><span class="start-choice-picture" id="startDressPicture"></span><span class="start-choice-name">おひめさま</span><i>▶</i></button>
      <button class="start-choice casual-choice" id="startCasual" aria-label="おようふくで あそぶ"><span class="start-choice-picture" id="startCasualPicture"></span><span class="start-choice-name">おようふく</span><i>▶</i></button>
    </div>
    <span class="start-caption">タッチで おしたく</span>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-label="おしたく"></section>
  </div>
  <audio id="maoVoice" preload="none" aria-hidden="true"></audio>
  <audio id="atelierMusic" preload="none" loop playsinline aria-hidden="true"></audio>
  <input id="photoInput" type="file" accept="image/*" hidden>
  <input id="cameraInput" type="file" accept="image/*" capture="user" hidden>
  <script>window.addEventListener('error',function(e){if(e.target&&e.target.tagName==='IMG')e.target.style.visibility='hidden'},true);</script>
</body>
</html>
